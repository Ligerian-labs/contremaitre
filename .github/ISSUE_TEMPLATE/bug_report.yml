name: Bug report
description: Report a reproducible problem with setup, deployment, or an environment.
title: "[Bug]: "
body:
  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: Include the command and the smallest manifest needed. Remove credentials and customer data.
      placeholder: "1. Start the hub\n2. Deploy this manifest\n3. Run this command"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: macOS version, Mac chip, container version, Bun version, and Contremaitre commit or installation date.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste the relevant failure output. Do not attach your state directory or secrets.
      render: text
