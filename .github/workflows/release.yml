name: CLI checks and releases
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: brew install traefik mkcert shellcheck
      - run: bun install --frozen-lockfile
      - run: shellcheck scripts/install.sh
      - run: bun run check
      - name: Package release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(bun -p "require('./package.json').version")"
          test "$(bin/contremaitre version)" = "contremaitre ${RELEASE_TAG#v}"
          codesign --verify --strict bin/contremaitre
          mkdir -p bin/release
          cp bin/contremaitre bin/release/contremaitre-darwin-arm64
          cp scripts/install.sh bin/release/install.sh
          cd bin/release
          shasum -a 256 contremaitre-darwin-arm64 > contremaitre-darwin-arm64.sha256
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: cli-release
          path: bin/release/
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cli-release
          path: release
      - name: Publish a complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > draft; then
            test "$(cat draft)" = true || { echo 'Release already published'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
